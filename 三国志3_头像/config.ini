; ============================================================
;  san3overlay 配置
;  三国志3(DOS) 高清头像浮层 —— 多目标 / 前台自动隐藏
; ============================================================

[DOSBox]
; 目标窗口标题（子串匹配，大小写不敏感）。可逗号分隔多个模拟器：
; 例如 "DOSBox-X, PCem, 86Box"。浮层只跟随"当前在前台"的那个匹配标题；
; 不在前台就整体隐藏，避免遮挡其它窗口。
window_title = DOSBox-X , PCem

[Common]
; 匹配分数低于此阈值就不绘制（保持原图）。大众脸(编号>307)不会匹配到，自动不动。
; 越接近 1 越严格（误配少、可能漏真脸）；越低越宽松（能抓到变形脸，但可能混入假阳性）。
match_threshold = 0.78
clear_shift = 2

; 迟滞：一旦显示，直到分数低于 (match_threshold - hysteresis) 才隐藏，
; 避免分数在阈值附近来回横跳导致的闪烁。
hysteresis = 0.05

; 每秒检测次数（越低越省 CPU、越稳；越高响应越快）。
fps = 30

; 上下黑边高度（单位：640x480 分辨率像素）。用了 16:10 裁剪 shader 后为 0。
; 若画面上下有黑边（如未裁剪的 640x480），改回 40。
black_bar = 0

; Qt 逻辑/物理像素换算系数（= 桌面缩放 %）。你的桌面是 150% 缩放，填 1.5。
; 若 DPI 变了或和显示器不一致，改成实际值（如 1.0 / 1.25 / 2.0）。
dpr = 1.5

; 默认的头像左上角锚点微调（屏幕像素，负=往左/上，正=往右/下）。
; 仅对"没有在 [offsets] 里单独配置"的目标生效。
offset_x = 0
offset_y = 0

; --------------------------------------------
; 按"目标窗口标题"分开设置头像参数（键 = 标题小写子串）。
; 值 = x , y , size_x , size_y , scale_x , scale_y
;   x/y  ：左上角位置的屏幕像素微调（负=往左/上）
;   size_x/size_y：高清脸的横向/纵向缩放（1.0 = 游戏原比例 64x80，即 4:5）
;     想要更大就 >1，想改横竖比例就让 size_x 和 size_y 不同。
;   scale_x/scale_y：整幅画面的横纵缩放（0 = 自动按内容区算；>0 强制用此值，
;     用于纠正"间隔不对"(PCem)的情况）。
;   content_x/content_y：游戏内容区在模拟器窗口里的像素偏移（-1 = 自动检测；
;     自动检测不准时（如最大化/全屏）手动填准确值，配合 scale_x/scale_y 钉死映射）。
; 没列到的目标用上面的 offset_x/offset_y（size=1.0、scale=自动、content=自动）。
; --------------------------------------------
[offsets]
dosbox-x = -12, -76, 1.0, 1.0, 0, 0, -1, -1
pcem = 0, -50, 1.0, 1.0, 3.0, 3.0, -1, -1

[Match]
; 粗筛时把画面缩小到 1/ds（省时间）；精配在 top-k 候选上做全分辨率匹配。
ds = 2
; 粗筛后拿来做全分辨率精配的候选数。
topk = 4
; 扫描的头像尺寸尺度（逗号分隔）。越少越快：要更快可改成 "1.0,0.5"（跳过 0.75x），
; 更稳可保留 "1.0,0.75,0.5"。秒级切换慢时优先缩短这个。
scales = 1.0, 0.5
